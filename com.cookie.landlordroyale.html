const keys = ["title","updated","intro","localTitle","localText","adsTitle","adsText","consentTitle","consentText","sharingTitle","sharingText","retentionTitle","retentionText","controlsTitle","controlsText","hostingTitle","hostingText","contactTitle","changesText","footerText"];
const languageSelect = document.getElementById("language");
function applyLanguage(code) {
  const copy = policy[code] || policy.en;
  document.documentElement.lang = code;
  for (const key of keys) document.getElementById(key).innerHTML = copy[key];
  document.title = copy.title + " · Landlord Royale";
  languageSelect.value = policy[code] ? code : "en";
}
languageSelect.addEventListener("change", () => applyLanguage(languageSelect.value));
const systemLanguage = (navigator.language || "en").toLowerCase();
const initialLanguage = systemLanguage.startsWith("zh-tw") || systemLanguage.startsWith("zh-hk") || systemLanguage.startsWith("zh-mo") || systemLanguage.startsWith("zh-hant") ? "zh-TW" : systemLanguage.slice(0,2);
applyLanguage(policy[initialLanguage] ? initialLanguage : "en");
</script>
